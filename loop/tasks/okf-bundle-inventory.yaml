task: Record which OKF v0.2 bundle-level features enkinex-okf does not model.
repo: ../enkinex-okf
gate: just check
retries: 1

# The gate cannot tell "task done" from "agent gave up" — it passes on an
# untouched tree. Naming the artefact is what makes the run verifiable.
# Output is docs/conformance.md, in enkinex-okf itself. It previously landed
# under a discovery directory, which is a stage the flow no longer has —
# analysis feeding a plan belongs in the private enkinex-pm now. But this
# artefact is not that: "which OKF v0.2 features this library does not model"
# is a conformance statement about a public spec, which is exactly what a user
# of the library needs and what the repo should carry publicly.
#
# It also has to land in the repo the loop runs against. Writing into
# enkinex-pm would put an agent's write across a repository boundary, which the
# plan-author rules forbid for the same reason: two histories, one commit.
#
# Not docs/library/ or docs/schemas/ — `just docs` generates into those.
expect:
  changed: true
  files:
    - docs/conformance.md

steps:
  # Deliberately narrow, and still worth keeping so after AIOPS-12. The two
  # 10-minute non-finishes that moved this agent off the free tier were on a
  # broad "read every module" prompt, and a bounded prompt is cheaper on any
  # tier — the re-pin removed the failure mode, not the reason for the shape.
  - agent: explore-enkinex
    prompt: |
      Use glob to list the *.k files in this repo. Do not read them.

      Then answer in your reply only, in at most 15 lines: of these five OKF
      v0.2 features — bundle tree (§3), index.md (§8), log.md (§9),
      cross-linking (§6), directory-level conformance (§11) — which are
      modelled by a KCL schema here, and which are not? Judge from the file
      names and the fact that this library types frontmatter only.

  - agent: docs-writer
    prompt: |
      Write docs/conformance.md. The docs/ directory already exists.

      Use this inventory from the previous step:

      ---
      {{previous}}
      ---

      Structure: a Status/Date/Feeds header block, one paragraph of purpose, a
      table (feature | spec section | modelled here? | note), and a short
      "What this implies for v0.3" section. Keep it under 40 lines.
